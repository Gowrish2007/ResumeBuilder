<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Resume Builder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(120deg, #84fab0, #8fd3f4);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .builder {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      background: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 95%;
      max-width: 1000px;
    }

    form {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 0.8rem;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 1rem;
      transition: 0.3s;
    }

    form input:focus,
    form textarea:focus {
      border-color: #84fab0;
      outline: none;
    }

    form textarea {
      resize: vertical;
      min-height: 80px;
    }

    .preview {
      flex: 1;
      background: #f7f9fc;
      padding: 2rem;
      border-radius: 15px;
      border: 2px dashed #ddd;
      overflow-y: auto;
      height: 500px;
    }

    .resume {
      background: #fff;
      border-radius: 15px;
      padding: 1.5rem;
      color: #333;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .resume h2 {
      color: #222;
      border-bottom: 2px solid #8fd3f4;
      padding-bottom: 5px;
      margin-bottom: 8px;
    }

    .download-btn {
      background: #84fab0;
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 1rem;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: #8fd3f4;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .builder {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <h1>🎨 Creative Resume Builder</h1>

  <div class="builder">
    <form id="resumeForm">
      <input type="text" id="name" placeholder="Full Name" />
      <input type="text" id="title" placeholder="Job Title (e.g. Web Developer)" />
      <textarea id="about" placeholder="About You"></textarea>
      <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
      <textarea id="experience" placeholder="Experience (e.g. Worked at XYZ, 2020-2024)"></textarea>
      <textarea id="education" placeholder="Education (e.g. BTech in CSE, KLU, 2024)"></textarea>
      <input type="text" id="email" placeholder="Email" />
      <input type="text" id="phone" placeholder="Phone" />
      <button type="button" class="download-btn" onclick="downloadPDF()">Download PDF</button>
    </form>

    <div class="preview">
      <div class="resume" id="resumePreview">
        <h2 id="pname">Your Name</h2>
        <h4 id="ptitle">Your Title</h4>
        <p id="pabout">Write a short about section...</p>
        <h2>Skills</h2>
        <ul id="pskills"><li>Skill 1</li><li>Skill 2</li></ul>
        <h2>Experience</h2>
        <p id="pexperience">Your experience will appear here.</p>
        <h2>Education</h2>
        <p id="peducation">Your education details.</p>
        <h2>Contact</h2>
        <p id="pemail">Email: example@mail.com</p>
        <p id="pphone">Phone: +91 00000 00000</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

  <script>
    const updatePreview = () => {
      document.getElementById("pname").textContent = document.getElementById("name").value || "Your Name";
      document.getElementById("ptitle").textContent = document.getElementById("title").value || "Your Title";
      document.getElementById("pabout").textContent = document.getElementById("about").value || "Write a short about section...";

      const skillsText = document.getElementById("skills").value;
      const skillList = document.getElementById("pskills");
      skillList.innerHTML = "";
      if (skillsText.trim() !== "") {
        skillsText.split(",").forEach(skill => {
          const li = document.createElement("li");
          li.textContent = skill.trim();
          skillList.appendChild(li);
        });
      }

      document.getElementById("pexperience").textContent = document.getElementById("experience").value || "Your experience will appear here.";
      document.getElementById("peducation").textContent = document.getElementById("education").value || "Your education details.";
      document.getElementById("pemail").textContent = "Email: " + (document.getElementById("email").value || "example@mail.com");
      document.getElementById("pphone").textContent = "Phone: " + (document.getElementById("phone").value || "+91 00000 00000");
    };

    document.querySelectorAll("input, textarea").forEach(el => {
      el.addEventListener("input", updatePreview);
    });

    function downloadPDF() {
      const element = document.getElementById("resumePreview");
      const opt = {
        margin: 0.5,
        filename: "My_Resume.pdf",
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
      };
      html2pdf().from(element).set(opt).save();
    }
  </script>
</body>
</html>
